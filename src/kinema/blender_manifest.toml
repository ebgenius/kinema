schema_version = "1.0.0"

id = "kinema"
version = "0.1.0"
name = "Kinema"
tagline = "Animation-ready robot rigs with correct IK, from URDF or MJCF"
maintainer = "Eugenio Bernardi"
type = "add-on"

website = "https://ebgenius.github.io/kinema/"
tags = ["Import-Export", "Rigging", "Animation"]

blender_version_min = "5.2.0"

