[project]
name = "kinema-docs"
version = "0.1.0"
description = "Sources for the Kinema documentation site."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Eugenio Bernardi" }]

# Empty on purpose. This branch builds a Markdown site and nothing else; the
# add-on and its runtime dependencies live on `main`. Mirroring them here made
# every docs build download ~130 MB of jaxlib, scipy and trimesh to render
# Markdown, because `uv sync` installs [project.dependencies] whatever group is
# named.
dependencies = []

[dependency-groups]
# What .github/workflows/docs.yml installs, via `uv sync --group docs`.
docs = ["mkdocs-material"]

[tool.uv]
package = false
